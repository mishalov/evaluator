name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily refresh at 06:30 UTC — fetches fresh ECB / World Bank data and
    # redeploys so the bundled snapshot stays current. Cron times :00 and :30
    # are heavily contested across GH Actions; offset slightly.
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test

      # `npm run build` runs `prebuild` (fetch-market-data.mjs) automatically.
      # The script is fail-soft: if a source is unreachable, it reuses the
      # previous snapshot rather than blocking the build.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
